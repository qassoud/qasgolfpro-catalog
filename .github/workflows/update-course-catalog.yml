
name: Update course catalog

on:
  push:
    branches:
      - main
    paths:
      - 'courses/**/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-catalog-update-main
  cancel-in-progress: false

jobs:
  update-course-catalog:
    name: Update and validate course catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update course catalog
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/update_course_catalog.py --dry-run
          else
            python scripts/update_course_catalog.py --before "$BEFORE"
          fi

      - name: Validate catalog
        run: python scripts/validate_catalog.py

      - name: Commit catalog updates
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- catalog.json; then
            echo "No catalog changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json
          git commit -m "chore(catalog): update course entries"
          git push origin HEAD:main
