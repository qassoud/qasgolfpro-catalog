name: Validate course catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-catalog:
    name: Validate catalog and course files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate catalog references
        run: python scripts/validate_catalog.py

      - name: Upload USA Lot 4 pack
        uses: actions/upload-artifact@v4
        with:
          name: QasGolfPro_USA_Lot_4_35_parcours
          path: tmp_transfer/QasGolfPro_USA_Lot_4_35_parcours.zip
          if-no-files-found: error
